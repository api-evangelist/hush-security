aid: hush-security
name: Hush Security
description: >-
  Hush Security delivers identity-first access management for AI agents,
  workloads, and non-human identities (NHIs), replacing static secrets and
  long-lived API keys with dynamic, identity-based access at runtime. The
  platform provides runtime discovery and inventory of non-human identities,
  secrets detection and remediation, risk and posture management, and
  identity-based access for workloads and agentic AI through an "identity as
  code" model. Hush exposes a REST API (api.us.hush-security.com/v1) secured with
  OAuth 2.0 client-credentials, a Terraform provider, Helm charts, a Kubernetes
  Universal Access Management (UAM) operator with AccessCredential /
  AccessPrivilege / AccessPolicy CRDs, and first-party Claude Code agent skills.
  The company is SOC 2 and ISO 27001 certified.
